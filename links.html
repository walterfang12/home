<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友链 - Walter_Fang</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://avatars.githubusercontent.com/u/185230233?v=4">
</head>
<body>
    <div class="container">
        <main class="card card-page">
            <!-- 返回按钮 -->
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                返回首页
            </a>

            <!-- 头像 -->
            <div class="avatar-wrapper">
                <img 
                    class="avatar avatar-sm" 
                    src="https://avatars.githubusercontent.com/u/185230233?v=4" 
                    alt="Walter_Fang's Avatar"
                />
            </div>

            <!-- 标题 -->
            <h1 class="name">友链</h1>
            <p class="bio">我的朋友们。</p>

            <!-- 友链列表 -->
            <div class="links-list">
                <!-- 示例友链条目 -->
                <a href="#" class="link-card" target="_blank">
                    <div class="link-avatar">
                        <img src="https://avatars.githubusercontent.com/u/185230233?v=4" alt="Avatar" />
                    </div>
                    <div class="link-info">
                        <span class="link-name">你的名字</span>
                        <span class="link-desc">写下你的简介吧~</span>
                    </div>
                </a>
                <a href="#" class="link-card" target="_blank">
                    <div class="link-avatar">
                        <img src="https://avatars.githubusercontent.com/u/185230233?v=4" alt="Avatar" />
                    </div>
                    <div class="link-info">
                        <span class="link-name">你的名字</span>
                        <span class="link-desc">写下你的简介吧~</span>
                    </div>
                </a>
            </div>

            <!-- 申请友链提示 -->
            <div class="link-apply">
                <p>想交换友链？通过以下方式联系我：</p>
                <div class="apply-methods">
                    <a href="https://github.com/walterfang12" target="_blank" class="apply-btn">GitHub Issues</a>
                    <a href="mailto:#" class="apply-btn">发送邮件</a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Walter_Fang. All rights reserved.</p>
        </footer>
    </div>

    <div class="bg-decoration">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
    </div>
</body>
</html>
